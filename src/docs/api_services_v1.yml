openapi: 3.0.1

info:
  version: "1.0.0"
  title: "Arithmetic calculator"
  description: API documentation

servers:
- url: http:localhost:3001/api/v1
- url: https://arithmetic-calculator-api.onrender.com/api/v1

security:
- CookieAuth: []
- Bearer: []

tags:
- name: Auth
  description: Authenticated users
- name: Operations
  description: Operations of records
- name: Records
  description: Records generated

paths:

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password

      responses:
        '200':
          description: |-
            Successful operation. The JWT is set as an httpOnly `access_token`
            cookie (SameSite=Lax in development, SameSite=None + Secure in
            production) and is intentionally NOT in the response body.
            The body carries the user's public profile (no password).
          headers:
            Set-Cookie:
              description: httpOnly session cookie (`access_token`)
              schema:
                type: string
        '400':
          description: Invalid request body (username/password must be strings)
        '401':
          description: Invalid credentials
        '429':
          description: Too many login attempts, please try again later
        '500':
          description: Internal server error

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout (clears the session cookie)
      security: []
      responses:
        '204':
          description: Session cookie cleared. Always succeeds.

  /auth/me:
    get:
      tags:
        - Auth
      summary: Current session (probe used by the SPA guard)
      responses:
        200:
          description: Authenticated; returns the caller's public profile
        401:
          description: Missing or invalid credentials

  /operations:
    get:
      tags:
        - Operations
      summary: Get all operations
      responses:
        200:
          description: OK

  /records:
    get:
      tags:
        - Records
      summary: Get all records
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: number
        - name: rowsPerPage
          in: query
          required: true
          schema:
            type: number
        - name: sortField
          in: query
          required: false
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK

    post:
      tags:
        - Records
      summary: Create a new record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstNumber:
                  type: string
                lastNumber:
                  type: string
                operation_id:
                  type: string
              required:
                - operation_id
      responses:
        200:
          description: OK

  /records/{id}:
    delete:
      tags:
        - Records
      summary: Delete a record by ID
      parameters:
        - name: id
          in: path
          description: Record ID
          required: true
          schema:
            type: string
      responses:
        204:
          description: Record soft-deleted (empty body)
        401:
          description: Missing or invalid token
        404:
          description: Record not found (or not owned by the caller)

components:

  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly session cookie set by POST /auth/login. Used by the browser SPA.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued at login; accepted for non-browser tooling. The login response no longer returns the token in the body, so interactive browser clients use CookieAuth.
      in: header